name: kalpa

# Settings shared by every container that runs the Laravel app (api, horizon, scheduler, reverb).
x-laravel-env: &laravel-env
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: ${REVERB_APP_ID:-kalpa}
  REVERB_APP_KEY: ${REVERB_APP_KEY:-change-me-key}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:-change-me-secret}
  # Laravel publishes events to Reverb inside the Docker network.
  REVERB_HOST: reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http

services:
  postgres:
    image: postgres:18-alpine
    container_name: kalpa-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kalpa}
      POSTGRES_USER: ${POSTGRES_USER:-kalpa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kalpa}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: kalpa-redis
    command: ["redis-server", "--maxmemory", "96mb"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: kalpa-seaweedfs
    # One process: master + volume + filer + S3 gateway on :8333. The S3 identity comes from .env.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities": [{"name": "kalpa",
          "credentials": [{"accessKey": "$${S3_ACCESS_KEY}", "secretKey": "$${S3_SECRET_KEY}"}],
          "actions": ["Admin", "Read", "List", "Tagging", "Write"]}]}
        EOF
        exec weed server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=0 \
          -volume.index=leveldb -volume.concurrentUploadLimitMB=64 -volume.concurrentDownloadLimitMB=64 \
          -filer.concurrentUploadLimitMB=64 \
          -s3 -s3.port=8333 -s3.config=/tmp/s3.json \
          -s3.cacheCapacityMB=0 -s3.readerCacheSizeMB=32 -s3.concurrentUploadLimitMB=64
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kalpa}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-kalpa-secret}
      # Keep SeaweedFS inside its limit: Go's heap target here, and the buffer caps on the command above
      # (their defaults are unlimited; it was OOM-killed on 600 MB uploads and downloads without them).
      GOMEMLIMIT: 256MiB
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20
    mem_limit: 384m
    restart: unless-stopped

  api:
    build:
      context: ./docker/api
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: kalpa-api:dev
    container_name: kalpa-api
    environment: *laravel-env
    # Install PHP packages on first start (fresh clone), make sure the storage buckets exist,
    # then serve /app/public.
    command: ["sh", "-c", "[ -d vendor ] || composer install; php artisan kalpa:storage-setup || echo 'storage setup failed'; exec frankenphp run --config /etc/frankenphp/Caddyfile --adapter caddyfile"]
    volumes:
      - ./apps/api:/app
      # Asset kind JSON Schemas, shared with the web app.
      - ./packages/schemas:/schemas:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  # Queue workers (Laravel Horizon): server jobs and broadcast events.
  horizon:
    image: kalpa-api:dev
    container_name: kalpa-horizon
    command: ["php", "artisan", "horizon"]
    environment: *laravel-env
    volumes:
      - ./apps/api:/app
      - ./packages/schemas:/schemas:ro
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    mem_limit: 256m
    restart: unless-stopped

  # Runs scheduled commands (uploads:expire, jobs:requeue-expired, workers:mark-offline).
  # No healthcheck of its own: schedule:work has no status command.
  scheduler:
    image: kalpa-api:dev
    container_name: kalpa-scheduler
    command: ["php", "artisan", "schedule:work"]
    environment: *laravel-env
    # The image's own healthcheck checks the web server, which this container doesn't run.
    healthcheck:
      disable: true
    volumes:
      - ./apps/api:/app
      - ./packages/schemas:/schemas:ro
    depends_on:
      api:
        condition: service_started
    mem_limit: 128m
    restart: unless-stopped

  # Websockets for live updates. Browsers reach it through Caddy at /app/*.
  reverb:
    image: kalpa-api:dev
    container_name: kalpa-reverb
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment: *laravel-env
    volumes:
      - ./apps/api:/app
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    restart: unless-stopped

  web:
    image: node:24-alpine
    container_name: kalpa-web
    user: "${UID:-1000}:${GID:-1000}"
    # Same layout as the repo, so apps/web can import ../../packages/* by path alias.
    working_dir: /kalpa/apps/web
    # Install npm packages on first start (fresh clone), then run the Nuxt dev server, or in
    # preview mode (KALPA_WEB_MODE=preview, see make web-preview) build the app and serve the build,
    # which is what works offline (service worker).
    command:
      - sh
      - -c
      - |
        [ -d node_modules ] || npm ci
        if [ "$$KALPA_WEB_MODE" = preview ]; then
          npx nuxi generate && exec node scripts/serve-static.mjs
        fi
        exec npm run dev -- --host 0.0.0.0 --port 3000
    environment:
      HOME: /tmp
      NODE_OPTIONS: --max-old-space-size=512
      # Public websocket key for laravel-echo (the secret stays server-side).
      NUXT_PUBLIC_REVERB_KEY: ${REVERB_APP_KEY:-change-me-key}
      KALPA_WEB_MODE: ${KALPA_WEB_MODE:-dev}
      NUXT_TELEMETRY_DISABLED: 1
    volumes:
      - ./apps/web:/kalpa/apps/web
      - ./packages:/kalpa/packages
    mem_limit: 768m
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: kalpa-caddy
    ports:
      - "127.0.0.1:${KALPA_HTTP_PORT:-8089}:80"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - api
      - web
      - seaweedfs
      - reverb
    mem_limit: 128m
    restart: unless-stopped

  # Optional local LLM server (Ollama, MIT) for the assistant. The "ai" profile keeps it out of
  # make up: start it with make ai-up, get a model with make ai-pull MODEL=qwen3:1.7b.
  # CPU only here (the GT 710 is too old for Ollama's CUDA). The browser calls it directly on
  # localhost:11434, so it allows the app's origin; it is bound to 127.0.0.1 only.
  ollama:
    image: ollama/ollama:0.40.6
    container_name: kalpa-ollama
    profiles: [ai]
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_ORIGINS: http://localhost:${KALPA_HTTP_PORT:-8089},http://127.0.0.1:${KALPA_HTTP_PORT:-8089}
      # One model and one request at a time, unloaded after 5 idle minutes, to stay inside 3 GB.
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_CONTEXT_LENGTH: 4096
    volumes:
      - ollama-models:/root/.ollama
    mem_limit: 3g
    restart: unless-stopped

  # End-to-end tests (Playwright, Apache-2.0). Only for make e2e: the e2e profile keeps it out of
  # make up. Host networking, so the browser opens http://localhost:8089 like a person would.
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    container_name: kalpa-e2e
    profiles: [e2e]
    user: "${UID:-1000}:${GID:-1000}"
    network_mode: host
    ipc: host
    working_dir: /e2e
    command: sh -c "[ -d node_modules ] || npm ci; exec npx playwright test"
    environment:
      HOME: /tmp
      CI: 1
    volumes:
      - ./e2e:/e2e
    mem_limit: 2g

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  seaweedfs-data:
  ollama-models:
